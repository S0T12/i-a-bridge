name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-bridge
          xcodegen generate

      - name: Build Archive
        run: |
          cd ios-bridge
          xcodebuild archive \
            -project CallBridge.xcodeproj \
            -scheme CallBridge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/CallBridge.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          cd ios-bridge
          mkdir -p build/Payload
          cp -r build/CallBridge.xcarchive/Products/Applications/CallBridge.app build/Payload/
          cd build
          zip -r CallBridge.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallBridge-iOS-IPA
          path: ios-bridge/build/CallBridge.ipa
