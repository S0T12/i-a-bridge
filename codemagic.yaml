workflows:
  ios-build:
    name: Build CallBridge iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode Project
        script: |
          cd ios-bridge
          xcodegen generate
      - name: Build Archive
        script: |
          cd ios-bridge
          xcodebuild archive \
            -project CallBridge.xcodeproj \
            -scheme CallBridge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/CallBridge.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          cd ios-bridge
          mkdir -p build/Payload
          cp -r build/CallBridge.xcarchive/Products/Applications/CallBridge.app build/Payload/
          cd build
          zip -r CallBridge.ipa Payload
    artifacts:
      - ios-bridge/build/*.ipa
